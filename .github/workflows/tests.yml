name: Quality and performance smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python formatting
        run: python -m ruff format --check app tests load_tests
      - name: Lint Python files
        run: python -m ruff check app tests load_tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate passing and failing report demos
        shell: bash
        run: |
          python -m app.performance_report --current examples/current_stats_pass.csv --baseline examples/baseline_stats.csv --out reports/demo-pass
          set +e
          python -m app.performance_report --current examples/current_stats_regression.csv --baseline examples/baseline_stats.csv --out reports/demo-regression
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo "Expected regression demo exit code 1, received $result"
            exit 1
          fi
      - name: Upload report demo artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-demos
          path: |
            reports/demo-pass.json
            reports/demo-pass.md
            reports/demo-regression.json
            reports/demo-regression.md
          if-no-files-found: error

  load-smoke:
    name: Local load-test smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start local API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/performance-lab-api.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/performance-lab-api.log
          exit 1
      - name: Run bounded Locust smoke test
        run: python -m locust -f load_tests/locustfile.py --headless --users 2 --spawn-rate 1 --run-time 10s --stop-timeout 5 --exit-code-on-error 1
